name: sprawozdanie
on: push
jobs: 
  pdf:
    runs-on: ubuntu-22.04
    steps:
      - run: sudo apt-get install inkscape pandoc texlive-xetex  #potrzebne by wykonać pdf
      - uses: actions/checkout@v4
      - run: pip install ipykernel nbconvert pint open-atmos-jupyter-utils scipy numby matplotlib PyMPDATA
      - run: python -m nbconvert --to pdf --execute "project/beach_slope.ipynb"  # zamiast to pdf  można np. to script
      - uses: actions/upload-artifact@v4 #zapisywanie pdf na dłużej niz jednorazowo 
        with:
          path: project/beach_slope.pdf #nazwa pliku który chcemy żeby przetrwał 